<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebSocket demo client</title>
  <style>
    body { font-family: ui-monospace, monospace; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; margin: 1rem 0; white-space: pre-wrap; }
    .sys { color: #888; }
    .in  { color: #0a6; }
    .out { color: #06c; }
    input[type=text] { width: 60%; padding: .4rem; }
    button { padding: .4rem .8rem; }
  </style>
</head>
<body>
  <h1>WebSocket demo</h1>

  <label>
    Endpoint:
    <select id="endpoint">
      <option value="/ws/chat">/ws/chat (broadcast)</option>
      <option value="/ws/echo">/ws/echo (echo)</option>
    </select>
  </label>
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>

  <div id="log"></div>

  <form id="form">
    <input id="msg" type="text" placeholder="type a message..." autocomplete="off" disabled />
    <button type="submit" disabled id="send">Send</button>
  </form>

  <script>
    let ws = null;
    const log = (text, cls) => {
      const div = document.createElement("div");
      div.textContent = text;
      div.className = cls;
      const el = document.getElementById("log");
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    };
    const setConnected = (connected) => {
      document.getElementById("connect").disabled = connected;
      document.getElementById("disconnect").disabled = !connected;
      document.getElementById("msg").disabled = !connected;
      document.getElementById("send").disabled = !connected;
    };

    document.getElementById("connect").onclick = () => {
      const path = document.getElementById("endpoint").value;
      // ws:// for http pages, wss:// for https pages
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}${path}`);

      ws.onopen    = ()  => { log(`-- connected to ${path}`, "sys"); setConnected(true); };
      ws.onmessage = (e) => log(`<< ${e.data}`, "in");
      ws.onerror   = ()  => log("-- error (see devtools network tab)", "sys");
      ws.onclose   = (e) => { log(`-- closed (code ${e.code})`, "sys"); setConnected(false); };
    };

    document.getElementById("disconnect").onclick = () => ws?.close(1000, "bye");

    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("msg");
      if (ws?.readyState === WebSocket.OPEN && input.value) {
        ws.send(input.value);
        log(`>> ${input.value}`, "out");
        input.value = "";
      }
    };
  </script>
</body>
</html>
