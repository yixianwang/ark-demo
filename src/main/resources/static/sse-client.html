<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SSE demo client</title>
  <style>
    body { font-family: ui-monospace, monospace; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; margin: 1rem 0; white-space: pre-wrap; }
    .sys { color: #888; }
    .in  { color: #0a6; }
    .out { color: #06c; }
    input[type=text] { width: 60%; padding: .4rem; }
    button { padding: .4rem .8rem; }
    fieldset { margin-bottom: 1rem; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>SSE demo</h1>

  <fieldset>
    <legend>1. countdown — finite stream</legend>
    <button id="countdown">Start /api/sse/countdown</button>
  </fieldset>

  <fieldset>
    <legend>2. notifications — broadcast channel</legend>
    <button id="subscribe">Subscribe</button>
    <button id="unsubscribe" disabled>Unsubscribe</button>
    <form id="form" style="display:inline">
      <input id="msg" type="text" placeholder="publish a message..." autocomplete="off" />
      <button type="submit">POST</button>
    </form>
  </fieldset>

  <div id="log"></div>

  <script>
    let countdownSource = null;
    let notifSource = null;

    const log = (text, cls) => {
      const div = document.createElement("div");
      div.textContent = text;
      div.className = cls;
      const el = document.getElementById("log");
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    };

    // --- finite stream -----------------------------------------------------
    document.getElementById("countdown").onclick = () => {
      countdownSource?.close();
      countdownSource = new EventSource("/api/sse/countdown");
      log("-- countdown: connecting", "sys");

      countdownSource.addEventListener("tick", (e) => log(`<< tick: ${e.data}`, "in"));
      countdownSource.addEventListener("done", (e) => {
        log(`<< done: ${e.data}`, "in");
        // IMPORTANT: a finished SSE response looks like a dropped connection to
        // EventSource, which would auto-reconnect and restart the countdown
        // forever. For finite streams the client must close explicitly.
        countdownSource.close();
        log("-- countdown: closed by client", "sys");
      });
      countdownSource.onerror = () => log("-- countdown: error/reconnecting", "sys");
    };

    // --- broadcast channel -------------------------------------------------
    document.getElementById("subscribe").onclick = () => {
      notifSource = new EventSource("/api/sse/notifications");
      document.getElementById("subscribe").disabled = true;
      document.getElementById("unsubscribe").disabled = false;

      notifSource.addEventListener("connected", (e) => log(`<< ${e.data}`, "sys"));
      // e.lastEventId shows the id: field the server attached to the event.
      notifSource.addEventListener("notification", (e) =>
        log(`<< notification #${e.lastEventId}: ${e.data}`, "in"));
      // Fires on network failure too — EventSource reconnects automatically,
      // sending a Last-Event-ID header with the last id it saw.
      notifSource.onerror = () => log("-- notifications: error/reconnecting", "sys");
    };

    document.getElementById("unsubscribe").onclick = () => {
      notifSource?.close();
      notifSource = null;
      document.getElementById("subscribe").disabled = false;
      document.getElementById("unsubscribe").disabled = true;
      log("-- notifications: unsubscribed", "sys");
    };

    // SSE is one-way: publishing goes over a plain POST.
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("msg");
      if (!input.value) return;
      const res = await fetch("/api/sse/notifications", {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: input.value,
      });
      log(`>> ${input.value} (${(await res.text()).trim()})`, "out");
      input.value = "";
    };
  </script>
</body>
</html>
